name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint, test y vulnerabilidades
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configurar Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Verificar formato
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: go vet
        run: go vet ./...

      - name: Compilar
        run: go build ./...

      - name: Tests con detector de carreras
        run: go test -race ./...

      - name: Escanear vulnerabilidades
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  build-release:
    name: Compilar binarios multiplataforma
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configurar Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Compilar todas las plataformas
        run: make release
